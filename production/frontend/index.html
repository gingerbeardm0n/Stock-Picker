<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Trading Scanner</title>
    <link rel="stylesheet" href="style.css">
    <!-- AG Grid CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/styles/ag-theme-alpine.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Momentum Trading Scanner</h1>
            <p class="subtitle">Ross Cameron Style Day Trading Watchlist</p>
        </header>

        <div class="controls">
            <!-- Mode Toggle -->
            <div class="mode-toggle">
                <button id="liveMode" class="mode-btn active">📊 Live Mode</button>
                <button id="backtestMode" class="mode-btn">📈 Backtest</button>
                <button id="liveTradingMode" class="mode-btn">⚡ Live Trading</button>
            </div>

            <!-- Date & Time Picker (only visible in backtest mode) -->
            <div id="backtestDatePicker" class="backtest-controls" style="display: none;">
                <label for="backtestDate">Date:</label>
                <input type="date" id="backtestDate" class="backtest-date-input">
                <label for="backtestTime">Time (ET):</label>
                <input type="time" id="backtestTime" class="backtest-time-input" value="09:00">
            </div>

            <!-- Main Scan Button -->
            <button id="scanBtn" class="btn btn-primary">Scan Now</button>

            <!-- Auto-refresh Toggle -->
            <button id="autoRefreshBtn" class="btn btn-secondary">⏱ Auto: Off</button>
            <span id="autoRefreshCountdown" class="countdown-text"></span>

            <!-- Status -->
            <div class="status">
                <span id="statusText">Ready</span>
                <span id="lastScan" class="last-scan"></span>
            </div>
        </div>

        <div class="criteria-panel">
            <div class="criteria-header">
                <h3>Scanner Criteria</h3>
                <form id="criteriaForm" class="criteria-grid">
                    <div class="criteria-item">
                        <label for="minPrice"><input type="checkbox" id="enableMinPrice" checked> Min Price ($)</label>
                        <input type="number" id="minPrice" step="1" min="0" value="2.00">
                    </div>
                    <div class="criteria-item">
                        <label for="maxPrice"><input type="checkbox" id="enableMaxPrice" checked> Max Price ($)</label>
                        <input type="number" id="maxPrice" step="1" min="0" value="20.00">
                    </div>
                    <div class="criteria-item">
                        <label for="minPremarketVolume"><input type="checkbox" id="enableMinPMVolume" checked> Min PM Volume</label>
                        <input type="number" id="minPremarketVolume" step="1000" min="0" value="100000">
                    </div>
                    <div class="criteria-item">
                        <label for="minPremarketGain"><input type="checkbox" id="enableMinPMGain" checked> Min PM Gain (%)</label>
                        <input type="number" id="minPremarketGain" step="0.5" value="10.0">
                    </div>
                    <div class="criteria-item">
                        <label for="minRelativeVolume"><input type="checkbox" id="enableMinRelVol" checked> Min Rel. Volume (x)</label>
                        <input type="number" id="minRelativeVolume" step="0.5" min="0" value="5.0">
                    </div>
                    <div class="criteria-item">
                        <label for="maxFloat"><input type="checkbox" id="enableMaxFloat" checked> Max Float (M)</label>
                        <input type="number" id="maxFloat" step="1" min="1" value="20">
                    </div>
                </form>
            </div>
        </div>

        <div id="progressContainer" class="progress-container" style="display: none;">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <span id="progressText" class="progress-text">Starting scan...</span>
        </div>

        <div class="results-summary">
            <h2>Market Scan Results (<span id="resultCount">0</span> stocks)</h2>
        </div>

        <!-- AG Grid Container -->
        <div id="stockGrid" class="ag-theme-alpine" style="height: 600px; width: 100%;"></div>
    </div>

    <!-- News Modal -->
    <div id="newsModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalSymbol"></h2>
                <button class="modal-close" onclick="closeNewsModal()">✕</button>
            </div>
            <div id="modalArticles" class="modal-articles"></div>
        </div>
    </div>

    <!-- Live Trading Tab (hidden by default; shown via JS tab logic) -->
    <div id="liveTradingTab" style="display:none; margin-top:1rem;">

        <!-- Status bar -->
        <div id="ltStatusBar" style="
            background:#1a1a2e; color:#e0e0e0; padding:8px 14px;
            border-radius:6px; display:flex; gap:16px; align-items:center;
            font-family:monospace; font-size:12px; margin-bottom:8px;">
            <span id="ltDot" style="color:#888;">●</span>
            <span id="ltStatus">Not running</span>
            <span style="color:#555;">|</span>
            <span id="ltBars">0 bars</span>
            <span style="color:#555;">|</span>
            <span id="ltPnl">P&amp;L: —</span>
            <span style="color:#555;">|</span>
            <span id="ltTrades">0 trades</span>
        </div>

        <!-- Main body: sidebar left, logs right -->
        <div style="display:flex; gap:8px; align-items:flex-start;">

            <!-- LEFT SIDEBAR: Watchlist + Position (fixed narrow width) -->
            <div style="width:220px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;">

                <!-- Watchlist -->
                <div style="background:#f4f4f4; border:1px solid #ddd; border-radius:6px; padding:8px;">
                    <div style="font-size:11px; font-weight:bold; color:#444; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;">
                        Watchlist (<span id="ltWatchCount">0</span>)
                    </div>
                    <table id="ltWatchTable" style="width:100%; border-collapse:collapse; font-size:11px;">
                        <thead>
                            <tr style="color:#888; text-align:left; border-bottom:1px solid #ddd;">
                                <th style="padding:2px 4px; font-weight:600;">Sym</th>
                                <th style="padding:2px 4px; font-weight:600; text-align:right;">$</th>
                                <th style="padding:2px 4px; font-weight:600; text-align:right;">Gain</th>
                                <th style="padding:2px 4px; font-weight:600; text-align:right;">RVol</th>
                            </tr>
                        </thead>
                        <tbody id="ltWatchBody"></tbody>
                    </table>
                </div>

                <!-- Active Position -->
                <div style="background:#f4f4f4; border:1px solid #ddd; border-radius:6px; padding:8px;">
                    <div style="font-size:11px; font-weight:bold; color:#444; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;">
                        Position
                    </div>
                    <div id="ltPosition" style="font-size:11px; color:#555;">None</div>
                </div>

            </div>

            <!-- RIGHT: Log stream (fills remaining space) -->
            <div style="flex:1; background:#111; border-radius:6px; padding:10px; min-width:0;">
                <!-- Filter bar -->
                <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
                    <input id="ltFilter" type="text" placeholder="filter..."
                        style="width:110px; background:#222; color:#eee; border:1px solid #444;
                               border-radius:4px; padding:2px 6px; font-size:11px;">
                    <button onclick="ltSetFilter('ENTRY SIGNAL')" style="background:#2a2500; color:#FFD700; border:1px solid #554400; border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">ENTRY</button>
                    <button onclick="ltSetFilter('EXIT')"         style="background:#2a1500; color:#FF8C00; border:1px solid #552200; border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">EXIT</button>
                    <button onclick="ltSetFilter('GAPRUN')"       style="background:#001a2a; color:#87CEEB; border:1px solid #004466; border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">GAPRUN</button>
                    <button onclick="ltSetFilter('Gate3')"        style="background:#1a1a1a; color:#aaa;    border:1px solid #444;    border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">Gate3</button>
                    <button onclick="ltSetFilter('Gate4')"        style="background:#1a1a1a; color:#aaa;    border:1px solid #444;    border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">Gate4</button>
                    <button onclick="ltClearFilter()"             style="background:#1a1a1a; color:#666;    border:1px solid #333;    border-radius:3px; padding:1px 7px; font-size:11px; cursor:pointer;">Clear</button>
                    <label style="color:#666; font-size:11px; margin-left:auto;">
                        <input type="checkbox" id="ltAutoScroll" checked> scroll
                    </label>
                </div>
                <div id="ltLog" style="
                    height:560px; overflow-y:auto; font-family:monospace;
                    font-size:11px; color:#c8f7c5; white-space:pre-wrap;
                    word-break:break-all; line-height:1.4;"></div>
            </div>

        </div>

    </div>
    <!-- /Live Trading Tab -->

    <!-- AG Grid JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/dist/ag-grid-community.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
