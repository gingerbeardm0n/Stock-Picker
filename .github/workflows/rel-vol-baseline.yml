name: Build Rel-Vol Baseline

on:
  schedule:
    # 4:30 PM ET = 20:30 UTC, weekdays (market closes 4 PM, data settles by 4:30)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip push to data branch)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to data branch

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # need full history for worktree-based push

      - name: Fetch data branch (for existing active_gapper_symbols.json)
        run: |
          git fetch origin data:data 2>/dev/null || echo "data branch not yet fetched (will be created on push)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Extract active_gapper_symbols.json from data branch
        run: |
          mkdir -p data
          if git show data:data/active_gapper_symbols.json > data/active_gapper_symbols.json 2>/dev/null; then
            echo "Loaded existing active_gapper_symbols.json from data branch"
            python3 -c "import json; d=json.load(open('data/active_gapper_symbols.json')); print(f'  {d[\"total\"]} symbols, as_of={d[\"as_of\"]}')"
          else
            echo "No existing active_gapper_symbols.json — starting from embedded seed list"
          fi

      - name: Build rel-vol baseline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python production/data/live_capture/build_baseline_cloud.py \
            --output-dir data/

      - name: Show output summary
        run: |
          echo "=== rel_vol_baseline.json ==="
          python3 -c "
          import json
          d = json.load(open('data/rel_vol_baseline.json'))
          print(f'  as_of={d[\"as_of\"]}')
          print(f'  {len(d[\"baselines\"])} symbols with baselines')
          sample = list(d['baselines'].items())[:5]
          for sym, val in sample:
              print(f'    {sym}: {val:,.0f}')
          "
          echo ""
          echo "=== active_gapper_symbols.json ==="
          python3 -c "
          import json
          d = json.load(open('data/active_gapper_symbols.json'))
          print(f'  as_of={d[\"as_of\"]}')
          print(f'  total={d[\"total\"]} symbols')
          added = d.get('added', [])
          if added:
              print(f'  newly added ({len(added)}): {added[:10]}')
          else:
              print('  no new symbols added today')
          "

      - name: Push to data branch
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Configure git identity for the bot commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use a temporary worktree to commit/push without touching main checkout
          TMPDIR=$(mktemp -d)
          git worktree add --detach "$TMPDIR/data_wt"

          cd "$TMPDIR/data_wt"
          git checkout --orphan data_new
          git reset

          mkdir -p data
          cp "$GITHUB_WORKSPACE/data/rel_vol_baseline.json" data/rel_vol_baseline.json
          cp "$GITHUB_WORKSPACE/data/active_gapper_symbols.json" data/active_gapper_symbols.json

          # Force-add (these paths are in .gitignore on main; data branch has no .gitignore)
          git add -f data/rel_vol_baseline.json data/active_gapper_symbols.json

          TODAY=$(python3 -c "from datetime import date; print(date.today().isoformat())")
          BASELINE_COUNT=$(python3 -c "import json; d=json.load(open('data/rel_vol_baseline.json')); print(len(d['baselines']))")
          git commit -m "data: rel_vol baseline ${TODAY} (${BASELINE_COUNT} symbols)"

          git push --force origin HEAD:data
          echo "Force-pushed both JSON files to origin/data"

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMPDIR/data_wt"

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN — skipped push to data branch"
